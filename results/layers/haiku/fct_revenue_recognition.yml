semantic_model:
  name: fct_revenue_recognition
  description: >
    Revenue recognition fact table at monthly granularity.
    Represents revenue recognized each month for subscription and services revenue.
    For subscription invoices, revenue is spread evenly across billing period days.
    For services invoices, full amount recognized on issued date.
    Excludes revenue for deleted or internal accounts.
  node_relation:
    schema_name: marts
    alias: fct_revenue_recognition
  defaults:
    agg_time_dimension: recognized_month
  measures:
    - name: recognized_revenue
      description: Revenue recognized in USD. Sum of subscription revenue spread daily plus services revenue recognized.
      agg: sum
      expr: (recognized_amount_minor * usd_per_unit) / pow(10, minor_unit_exponent)
    - name: count_invoices
      description: Count of invoices contributing to recognized revenue
      agg: count_distinct
      expr: invoice_id
  dimensions:
    - name: invoice_id
      description: Unique invoice identifier
      type: categorical
    - name: recognized_month
      description: Month in which revenue was recognized
      type: time
      time_granularity: day
    - name: account_id
      description: Customer account for recognized revenue
      type: categorical
      role: foreign_key
    - name: invoice_type
      description: Type of invoice (subscription, services)
      type: categorical
    - name: status
      description: Invoice status
      type: categorical
    - name: currency
      description: Invoice currency (USD, EUR, GBP, JPY)
      type: categorical
    - name: recognized_amount_minor
      description: Amount recognized in this month (in minor currency units)
      type: numeric
    - name: usd_per_unit
      description: FX rate to USD
      type: numeric
