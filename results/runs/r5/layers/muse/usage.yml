version: 2

semantic_models:
  - name: usage
    model: ref('fct_usage_daily')
    description: >-
      One row per account per day per event type with summed raw event quantity.
      Includes internal test accounts at row level; metrics filter to external
      accounts and billable events.
    defaults:
      agg_time_dimension: usage_date
    entities:
      - name: usage_day
        type: primary
        expr: account_id || '|' || cast(usage_date as varchar) || '|' || event_type
      - name: account
        type: foreign
        expr: account_id
    dimensions:
      - name: usage_date
        type: time
        expr: usage_date
        description: Calendar date the usage events occurred on.
        type_params:
          time_granularity: day
      - name: event_type
        type: categorical
        expr: event_type
        description: >-
          Api_call is customer-billable usage; health_check is a constant internal
          monitoring heartbeat excluded from billable usage.
    measures:
      - name: usage_quantity
        agg: sum
        expr: quantity
        description: >-
          Raw event quantity summed across rows. Covers every event type at measure
          level; the billable metric keeps api_call events on external accounts.

metrics:
  - name: billable_usage
    type: simple
    type_params:
      measure: usage_quantity
    filter:
      - "{{ Dimension('usage_day__event_type') }} = 'api_call'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"
    description: >-
      Billable api_call events. Excludes the health_check monitoring heartbeat plus
      internal and deleted accounts.
