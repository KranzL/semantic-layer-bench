version: 2

models:
  - name: sem_invoices
    description: Finalized invoices (open, paid, uncollectible) of external, non-deleted accounts with USD amounts.
  - name: sem_revenue_months
    description: Recognized revenue per invoice per month in USD for finalized invoices of external, non-deleted accounts.
  - name: sem_payments
    description: Payment attempts (succeeded and failed) of external, non-deleted accounts with USD amounts.
  - name: sem_refunds
    description: Credit notes (refunds on paid invoices) of external, non-deleted accounts with USD amounts.
  - name: sem_usage_daily
    description: Daily billable api_call usage per external, non-deleted account.

semantic_models:
  - name: invoices
    description: >
      Invoices, one row per invoice, dated by issue date. Includes finalized invoices only (status
      open, paid or uncollectible) for both subscription and one-off services invoices. Excludes
      draft and void invoices, and invoices of internal (QA, demo, sandbox) accounts. Amounts are
      converted from the invoice currency to USD at the issue-date FX rate. JPY has no minor
      unit, other currencies have 2 decimals.
    model: ref('sem_invoices')
    defaults:
      agg_time_dimension: issued_date
    entities:
      - name: invoice
        type: primary
        expr: invoice_id
        description: An invoice (INV-...).
      - name: account
        type: foreign
        expr: account_id
        description: The account billed.
      - name: customer
        type: foreign
        expr: customer_id
        description: The customer (top-level parent account) billed.
      - name: subscription
        type: foreign
        expr: subscription_id
        description: The subscription invoiced. Null for services invoices.
      - name: plan
        type: foreign
        expr: plan_id
        description: Plan of the subscription version in effect at the start of the invoiced period. Null for services invoices.
    dimensions:
      - name: issued_date
        type: time
        type_params:
          time_granularity: day
        description: Date the invoice was issued.
      - name: invoice_type
        type: categorical
        description: subscription (recurring seat fees for a service period) or services (one-off professional services).
      - name: invoice_status
        type: categorical
        description: open (issued, unpaid), paid, or uncollectible (written off). Draft and void invoices are not in this model.
      - name: currency
        type: categorical
        description: Invoice currency (USD, EUR, GBP, JPY). All amounts are reported in USD.
    measures:
      - name: billings_usd
        agg: sum
        description: Invoiced amount in USD after discounts and before tax (subtotal - discount). Includes subscription and services invoices that are open, paid or uncollectible. Excludes draft and void invoices, tax, and internal or deleted accounts. Not reduced by refunds.
      - name: gross_billings_usd
        agg: sum
        description: Invoice subtotal in USD before discounts and tax.
      - name: invoice_discounts_usd
        agg: sum
        expr: discount_usd
        description: Discounts applied on invoices in USD.
      - name: tax_billed_usd
        agg: sum
        expr: tax_usd
        description: Sales tax / VAT charged on invoices in USD. Collected for tax authorities and not revenue.
      - name: total_invoiced_usd
        agg: sum
        description: Invoice total in USD including tax (subtotal - discount + tax), i.e. the amount the customer is asked to pay.
      - name: invoice_count
        agg: sum
        expr: "1"
        description: Number of finalized invoices (open, paid, uncollectible).

  - name: revenue_recognition
    description: >
      Recognized revenue by calendar month, one row per invoice per month in which part of it is
      recognized. Subscription invoices are recognized ratably by day across their service period.
      Services invoices are recognized in full in the month issued. Amounts are net of invoice
      discounts, exclude tax, and are converted to USD at the invoice's issue-date FX rate. Includes
      open, paid and uncollectible invoices. Excludes draft and void invoices, and internal or
      deleted accounts. Not reduced by credit notes/refunds.
    model: ref('sem_revenue_months')
    defaults:
      agg_time_dimension: recognized_month
    entities:
      - name: revenue_month
        type: primary
        expr: revenue_month_id
        description: One invoice's recognized revenue in one month.
      - name: invoice
        type: foreign
        expr: invoice_id
        description: The invoice being recognized.
      - name: account
        type: foreign
        expr: account_id
        description: The account billed.
      - name: customer
        type: foreign
        expr: customer_id
        description: The customer (top-level parent account) billed.
      - name: plan
        type: foreign
        expr: plan_id
        description: Plan at the start of the invoiced period. Null for services revenue.
    dimensions:
      - name: recognized_month
        type: time
        type_params:
          time_granularity: day
        description: First day of the calendar month in which the revenue is recognized. Revenue is only available by month, so query at month or coarser grain (including fiscal_quarter and fiscal_year).
      - name: revenue_type
        type: categorical
        expr: invoice_type
        description: subscription (recurring, recognized ratably) or services (one-off, recognized when invoiced).
      - name: currency
        type: categorical
        description: Invoice currency. Revenue is reported in USD.
    measures:
      - name: recognized_revenue_usd
        agg: sum
        description: Revenue recognized in the month in USD, net of discounts and excluding tax. Includes subscription (ratable) and services (point-in-time) revenue. Excludes draft/void invoices, internal and deleted accounts, and is not reduced by refunds.

  - name: payments
    description: >
      Payment attempts against invoices, one row per attempt, dated by received date. Includes
      succeeded and failed attempts (failed ones are usually retried later). Amounts include tax
      and are converted to USD at the received-date FX rate. Excludes payments of internal and
      deleted accounts. There are no negative (refund) payments. Refunds are credit notes.
    model: ref('sem_payments')
    defaults:
      agg_time_dimension: received_date
    entities:
      - name: payment
        type: primary
        expr: payment_id
        description: A payment attempt.
      - name: invoice
        type: foreign
        expr: invoice_id
        description: The invoice being paid.
      - name: account
        type: foreign
        expr: account_id
        description: The paying account.
      - name: customer
        type: foreign
        expr: customer_id
        description: The customer (top-level parent account) paying.
    dimensions:
      - name: received_date
        type: time
        type_params:
          time_granularity: day
        description: Date the payment was received (or the attempt failed).
      - name: payment_status
        type: categorical
        description: succeeded (cash received) or failed (declined/returned, no cash).
      - name: payment_method
        type: categorical
        description: card, ach or wire.
      - name: currency
        type: categorical
        description: Payment currency, which is always the invoice currency. Amounts are reported in USD.
      - name: invoice_type
        type: categorical
        description: Type of invoice paid, subscription or services.
    measures:
      - name: cash_collected_usd
        agg: sum
        expr: case when payment_status = 'succeeded' then amount_usd else 0 end
        description: Cash received in USD from succeeded payments, gross of tax. Excludes failed payment attempts and internal or deleted accounts. Not reduced by refunds.
      - name: failed_payments_usd
        agg: sum
        expr: case when payment_status = 'failed' then amount_usd else 0 end
        description: Amount in USD of failed payment attempts. No cash was received.
      - name: successful_payment_count
        agg: sum
        expr: case when payment_status = 'succeeded' then 1 else 0 end
        description: Number of succeeded payments.
      - name: failed_payment_count
        agg: sum
        expr: case when payment_status = 'failed' then 1 else 0 end
        description: Number of failed payment attempts.

  - name: refunds
    description: >
      Credit notes, one row per credit note, dated by issue date. Every credit note is against a
      paid invoice, so each one returns money to the customer (a refund). Reasons are
      billing_error, downgrade_adjustment, goodwill and service_credit. Amounts are converted to
      USD at the issue-date FX rate. Excludes internal and deleted accounts.
    model: ref('sem_refunds')
    defaults:
      agg_time_dimension: refund_date
    entities:
      - name: credit_note
        type: primary
        expr: credit_note_id
        description: A credit note (CN-...).
      - name: invoice
        type: foreign
        expr: invoice_id
        description: The paid invoice being refunded.
      - name: account
        type: foreign
        expr: account_id
        description: The account refunded.
      - name: customer
        type: foreign
        expr: customer_id
        description: The customer (top-level parent account) refunded.
    dimensions:
      - name: refund_date
        type: time
        expr: issued_date
        type_params:
          time_granularity: day
        description: Date the credit note was issued.
      - name: refund_reason
        type: categorical
        description: billing_error, downgrade_adjustment, goodwill or service_credit.
      - name: currency
        type: categorical
        description: Credit note currency. Amounts are reported in USD.
    measures:
      - name: refunds_usd
        agg: sum
        expr: refund_usd
        description: Amount refunded to customers via credit notes, in USD (positive number). Excludes internal and deleted accounts.
      - name: refund_count
        agg: sum
        expr: "1"
        description: Number of credit notes (refunds) issued.

  - name: usage
    description: >
      Daily product usage, one row per account per day with billable activity. Includes only
      api_call events. Excludes health_check events (automated platform pings, a constant 288 per
      account per day, not billable) and usage by internal (QA, demo, sandbox) and deleted
      accounts. Includes usage on every day an external account sent API calls, whatever the
      subscription status.
    model: ref('sem_usage_daily')
    defaults:
      agg_time_dimension: usage_date
    entities:
      - name: account_usage_day
        type: primary
        expr: account_usage_day_id
        description: One account on one day.
      - name: account
        type: foreign
        expr: account_id
        description: The account that generated the usage.
      - name: customer
        type: foreign
        expr: customer_id
        description: The customer (top-level parent account) that generated the usage.
    dimensions:
      - name: usage_date
        type: time
        type_params:
          time_granularity: day
        description: Date of the usage.
    measures:
      - name: billable_api_calls
        agg: sum
        expr: api_calls
        description: Number of billable API calls (api_call events only). Excludes health_check pings and internal or deleted accounts.
      - name: usage_active_accounts
        agg: count_distinct
        expr: case when api_calls > 0 then account_id end
        description: Distinct accounts with at least one billable API call in the period.

metrics:
  - name: billings
    label: Billings
    description: >
      Amount invoiced in USD, net of discounts and excluding tax, by invoice issue date. Includes
      subscription and one-off services invoices with status open, paid or uncollectible. Excludes
      draft and void invoices, tax, and internal (QA, demo, sandbox) or deleted accounts. Not
      reduced by refunds. FX at the issue-date rate.
    type: simple
    type_params:
      measure: billings_usd

  - name: gross_billings
    label: Gross billings (before discounts)
    description: Invoice subtotals in USD before discounts and tax, same invoice scope as billings.
    type: simple
    type_params:
      measure: gross_billings_usd

  - name: invoice_discounts
    label: Invoice discounts
    description: Discounts granted on finalized invoices in USD, same invoice scope as billings.
    type: simple
    type_params:
      measure: invoice_discounts_usd

  - name: tax_billed
    label: Tax billed
    description: Sales tax / VAT charged on finalized invoices in USD. Collected on behalf of tax authorities and not revenue.
    type: simple
    type_params:
      measure: tax_billed_usd

  - name: total_invoiced
    label: Total invoiced (incl. tax)
    description: Invoice totals in USD including tax (billings + tax), same invoice scope as billings.
    type: simple
    type_params:
      measure: total_invoiced_usd

  - name: invoices_issued
    label: Invoices issued
    description: Number of finalized invoices (open, paid, uncollectible) issued. Excludes drafts, voids and internal or deleted accounts.
    type: simple
    type_params:
      measure: invoice_count

  - name: recognized_revenue
    label: Recognized revenue
    description: >
      Revenue recognized in the month in USD (GAAP-style). Subscription invoices are spread
      ratably by day over their service period. Services invoices are recognized when issued. Net
      of discounts, excluding tax. Includes open, paid and uncollectible invoices. Excludes draft
      and void invoices and internal or deleted accounts. Not reduced by refunds. Month is the
      finest grain. Invoices already issued are scheduled through the end of their service
      period, so months after the last invoice date (Jun 2025) show the remaining deferred
      revenue of annual invoices, not a forecast of new sales.
    type: simple
    type_params:
      measure: recognized_revenue_usd

  - name: cash_collected
    label: Cash collected
    description: >
      Cash received in USD from succeeded payments, by received date. Gross of tax, converted at the
      received-date FX rate. Excludes failed payment attempts and internal or deleted accounts. Not
      reduced by refunds (see net_cash_collected).
    type: simple
    type_params:
      measure: cash_collected_usd

  - name: failed_payments
    label: Failed payment amount
    description: Amount in USD of failed payment attempts (no cash received). The same invoice can fail more than once before it is paid.
    type: simple
    type_params:
      measure: failed_payments_usd

  - name: refunds
    label: Refunds
    description: >
      Money returned to customers in USD via credit notes, by credit note issue date (positive
      number). Every credit note is against a paid invoice. Includes all reasons (billing_error,
      downgrade_adjustment, goodwill, service_credit). Excludes internal and deleted accounts.
    type: simple
    type_params:
      measure: refunds_usd

  - name: refund_count
    label: Refunds issued
    description: Number of credit notes (refunds) issued. Excludes internal and deleted accounts.
    type: simple
    type_params:
      measure: refund_count

  - name: net_cash_collected
    label: Net cash collected
    description: Cash collected minus refunds, in USD. Payments by received date, refunds by credit note issue date.
    type: derived
    type_params:
      expr: cash_collected - refunds
      metrics:
        - name: cash_collected
        - name: refunds

  - name: billable_usage
    label: Billable usage (API calls)
    description: >
      Number of billable API calls (api_call events). Excludes health_check pings, which are
      automated and not billable, and usage by internal (QA, demo, sandbox) or deleted accounts.
    type: simple
    type_params:
      measure: billable_api_calls

  - name: usage_active_accounts
    label: Accounts with billable usage
    description: Distinct external accounts with at least one billable API call in the period. Does not add up across periods.
    type: simple
    type_params:
      measure: usage_active_accounts
