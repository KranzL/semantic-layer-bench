version: 2

semantic_models:
  - name: sem_revenue_recognition
    description: >
      One row per invoice per calendar month in which some amount of that invoice's value
      was recognized (fct_revenue_recognition). Subscription invoice amounts are spread
      evenly, day by day, across the invoice's service period (period_start to
      period_end) and rolled up to the recognized month; services invoice amounts are
      recognized in full on the day they are issued. This is accrual-basis revenue
      recognition, independent of when (or whether) cash was actually collected.
    model: ref('fct_revenue_recognition')
    defaults:
      agg_time_dimension: recognized_month
    entities:
      - name: invoice_id
        type: primary
      - name: account_id
        type: foreign
    dimensions:
      - name: recognized_month
        type: time
        type_params:
          time_granularity: month
        description: >
          Calendar month in which the revenue was recognized. invoice_type and status
          for the underlying invoice are available via the invoice_id entity join to
          sem_billing_invoices (e.g. group by invoice_id__status) rather than being
          redeclared here.
    measures:
      - name: recognized_amount
        description: >
          Recognized revenue in USD for the invoice/month, converted at the invoice's fx
          rate. Only includes invoices that were actually finalized and sent to the
          customer (status "open", "paid" or "uncollectible"); excludes "draft" invoices
          (not yet sent) and "void" invoices (canceled, customer never charged).
          Uncollectible invoices remain included because the revenue was still earned and
          delivered at the time of billing; the later write-off is a bad-debt/collections
          outcome, not a reversal of revenue recognition. Excludes Relay's internal/test
          accounts.
        agg: sum
        expr: >
          case when status not in ('draft', 'void')
          then recognized_amount_minor / power(10, minor_unit_exponent) * usd_per_unit
          end

metrics:
  - name: recognized_revenue
    description: >
      Recognized revenue: accrual-basis revenue in USD, with subscription revenue spread
      ratably over each invoice's service period and services revenue recognized on the
      invoice issue date. Excludes draft and void invoices and Relay's internal/test
      accounts; includes uncollectible invoices (see the recognized_amount measure for
      why). Distinct from billings (amount invoiced, not time-spread) and cash_collected
      (amount actually paid). Slice by recognized_month (metric_time), invoice_type,
      status, and via joined account dimensions by segment, region and billing_currency.
    type: simple
    type_params:
      measure: recognized_amount
    filter: |
      {{ Dimension('account_id__is_internal') }} = false
