semantic_models:
  - name: accounts
    description: One row per customer account, including internal test accounts and soft-deleted accounts. Join target for account attributes on every metric; metric filters exclude internal and deleted accounts unless a description says otherwise.
    model: ref('dim_accounts')
    entities:
      - name: account
        description: The customer account. Primary key of dim_accounts. Every account counts as its own customer; child accounts are not rolled up to parents.
        type: primary
        expr: account_id
    dimensions:
      - name: account_name
        description: Display name of the account. Includes all accounts, including internal and deleted ones.
        type: categorical
      - name: segment
        description: Company size segment (Enterprise, MidMarket, SMB) assigned to the account. Includes all accounts, including internal and deleted ones.
        type: categorical
      - name: region
        description: Sales region of the account (NA, EMEA, APAC, LATAM) based on the account country. Includes all accounts, including internal and deleted ones.
        type: categorical
      - name: country
        description: Two-letter country code of the account. Includes all accounts, including internal and deleted ones.
        type: categorical
      - name: billing_currency
        description: ISO currency code the account is billed in (USD, EUR, GBP, JPY). Includes all accounts, including internal and deleted ones.
        type: categorical
      - name: is_internal
        description: True for Relay employee or test accounts. Internal accounts are excluded from every finance and sales metric.
        type: categorical
      - name: is_deleted
        description: True when the account was soft-deleted (deleted_at is set). Deleted accounts are excluded from every finance and sales metric.
        type: categorical
      - name: parent_account_id
        description: Owning account for subsidiary accounts, null for standalone accounts. Informational only; metrics count each account separately and never roll children into parents.
        type: categorical
      - name: created_date
        description: Date the account record was created. Includes all accounts, including internal and deleted ones.
        type: time
        type_params:
          time_granularity: day

  - name: plans
    description: One row per subscription plan. Join target for plan attributes on subscription metrics.
    model: ref('dim_plans')
    entities:
      - name: plan
        description: The subscription plan. Primary key of dim_plans.
        type: primary
        expr: plan_id
    dimensions:
      - name: plan_name
        description: Display name of the plan, including monthly and annual variants such as Scale and Scale Annual.
        type: categorical
      - name: plan_family
        description: Plan family across billing intervals (Starter, Growth, Scale, Enterprise). Annual variants share the family of their monthly equivalent.
        type: categorical
      - name: billing_interval
        description: Contract billing interval of the plan version, month or year. Annual plans are normalized by dividing by 12 in MRR.
        type: categorical

  - name: sales_reps
    description: One row per sales representative. Join target for sales team attributes on pipeline and bookings metrics.
    model: ref('dim_sales_reps')
    entities:
      - name: sales_rep
        description: The sales representative who owns an opportunity. Primary key of dim_sales_reps.
        type: primary
        expr: rep_id
    dimensions:
      - name: rep_name
        description: Display name of the sales representative.
        type: categorical
      - name: team
        description: Sales team of the representative (NA Sales, EMEA Sales, APAC Sales, LATAM Sales).
        type: categorical
      - name: region
        description: Sales region of the representative (NA, EMEA, APAC, LATAM).
        type: categorical
      - name: hired_at
        description: Date the representative was hired.
        type: time
        type_params:
          time_granularity: day
