metrics:
  - name: mrr
    description: Monthly recurring revenue in USD at month-end. Includes active and past_due seat subscriptions of external non-deleted accounts, with seats times discounted unit price and annual contracts divided by 12, converted at month-end FX. Excludes trialing and canceled subscriptions, mid-month churn that never spanned a month-end, and internal or deleted accounts.
    type: simple
    type_params:
      measure: mrr_usd
    filter:
      - "{{ Dimension('subscription__status') }} IN ('active', 'past_due')"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: arr
    description: Annualized recurring revenue in USD, defined as MRR times 12. Includes and excludes exactly what MRR includes and excludes.
    type: derived
    type_params:
      expr: mrr * 12
      metrics:
        - name: mrr

  - name: paying_customers
    description: Distinct accounts with at least one active or past_due subscription at month-end. Includes multi-subscription accounts once and past_due accounts. Excludes trial-only, canceled and never-subscribed accounts, child-account rollups (each account counts separately), and internal or deleted accounts.
    type: simple
    type_params:
      measure: paying_accounts
    filter:
      - "{{ Dimension('subscription__status') }} IN ('active', 'past_due')"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: arpa
    description: Average revenue per paying account in USD per month, defined as MRR divided by paying customers. Includes and excludes exactly what its inputs include and excludes. Only sliceable by time and account attributes shared by both inputs.
    type: ratio
    type_params:
      numerator: mrr
      denominator: paying_customers

  - name: new_customers
    description: Distinct accounts whose first paying month is the row month. Excludes reactivations after a churn, trial starts without conversion, and internal or deleted accounts. Left-censored, so accounts already paying in Jan 2023 count as new in Jan 2023.
    type: simple
    type_params:
      measure: new_accounts
    filter:
      - "{{ Dimension('account_month__is_new') }} = true"

  - name: logo_churn
    description: Distinct accounts that were paying last month-end but are not paying this month-end. Excludes never-paying accounts and internal or deleted accounts. Always zero in Jan 2023, which has no predecessor.
    type: simple
    type_params:
      measure: churned_accounts
    filter:
      - "{{ Dimension('account_month__is_churned') }} = true"

  - name: prior_month_paying_customers
    description: Distinct accounts that were paying at the previous month-end. Denominator input for churn rate; zero in Jan 2023. Excludes internal or deleted accounts.
    type: simple
    type_params:
      measure: prior_paying_accounts
    filter:
      - "{{ Dimension('account_month__prev_is_paying') }} = true"

  - name: churn_rate
    description: Share of last month paying customers lost this month, defined as logo churn divided by prior month paying customers. Excludes revenue expansion and contraction; it is logo churn, not revenue churn. Undefined in Jan 2023.
    type: ratio
    type_params:
      numerator: logo_churn
      denominator: prior_month_paying_customers

  - name: billings
    description: Amounts invoiced to customers in USD at issue-date FX, net of discounts and excluding sales tax. Includes paid, open and uncollectible subscription and services invoices of external non-deleted accounts. Excludes draft invoices (never issued), void invoices (canceled), tax, and internal or deleted accounts.
    type: simple
    type_params:
      measure: billed_usd
    filter:
      - "{{ Dimension('invoice__status') }} NOT IN ('draft', 'void')"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: recognized_revenue
    description: Revenue recognized in USD at invoice issue-date FX, net of discounts and excluding sales tax. Includes subscription revenue spread evenly over each invoice service period and services revenue recognized in full on the issue date, for paid, open and uncollectible invoices of external non-deleted accounts. Excludes draft and void invoices, tax, and internal or deleted accounts.
    type: simple
    type_params:
      measure: recognized_usd
    filter:
      - "{{ Dimension('revenue_month__status') }} NOT IN ('draft', 'void')"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: cash_collected
    description: Gross cash received from customers in USD at receipt-date FX, at the full amount paid including any tax passed through. Includes succeeded card, ach and wire payments of external non-deleted accounts. Excludes failed payment attempts and internal or deleted accounts.
    type: simple
    type_params:
      measure: collected_usd
    filter:
      - "{{ Dimension('payment__status') }} = 'succeeded'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: refunds
    description: Credit notes issued to customers in USD at issue-date FX. Includes every reason (billing_error, downgrade_adjustment, goodwill, service_credit) for external non-deleted accounts. Excludes internal or deleted accounts.
    type: simple
    type_params:
      measure: refunded_usd
    filter:
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: billable_usage
    description: Count of billable usage events (api_call) generated by external non-deleted accounts. Excludes health_check heartbeat monitor events and internal or deleted accounts.
    type: simple
    type_params:
      measure: billable_events
    filter:
      - "{{ Dimension('usage_day__event_type') }} = 'api_call'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: bookings
    description: Closed-won opportunity amount in USD by close date. Includes new-business and expansion bookings for external non-deleted accounts. Excludes open pipeline, closed-lost deals, and internal or deleted accounts.
    type: simple
    type_params:
      measure: booking_usd
    filter:
      - "{{ Dimension('opportunity__stage') }} = 'closed_won'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: new_bookings
    description: Closed-won new-business opportunity amount in USD by close date. Includes only opportunity type new for external non-deleted accounts. Excludes expansion, open pipeline, closed-lost deals, and internal or deleted accounts.
    type: simple
    type_params:
      measure: new_booking_usd
    filter:
      - "{{ Dimension('opportunity__stage') }} = 'closed_won'"
      - "{{ Dimension('opportunity__opportunity_type') }} = 'new'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: expansion_bookings
    description: Closed-won expansion opportunity amount in USD by close date. Includes only opportunity type expansion for external non-deleted accounts. Excludes new-business, open pipeline, closed-lost deals, and internal or deleted accounts.
    type: simple
    type_params:
      measure: expansion_booking_usd
    filter:
      - "{{ Dimension('opportunity__stage') }} = 'closed_won'"
      - "{{ Dimension('opportunity__opportunity_type') }} = 'expansion'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: opportunities_won
    description: Count of opportunities that closed as won, for external non-deleted accounts. Excludes open and lost opportunities and internal or deleted accounts.
    type: simple
    type_params:
      measure: won_opportunities
    filter:
      - "{{ Dimension('opportunity__stage') }} = 'closed_won'"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: opportunities_closed
    description: Count of decided opportunities (closed-won plus closed-lost) for external non-deleted accounts. Excludes open pipeline and internal or deleted accounts.
    type: simple
    type_params:
      measure: closed_opportunities
    filter:
      - "{{ Dimension('opportunity__stage') }} IN ('closed_won', 'closed_lost')"
      - "{{ Dimension('account__is_internal') }} = false"
      - "{{ Dimension('account__is_deleted') }} = false"

  - name: win_rate
    description: Share of decided opportunities that closed as won, defined as opportunities won divided by opportunities closed, by close date. Excludes open pipeline, which is undecided. Count-based; ignores opportunity amounts.
    type: ratio
    type_params:
      numerator: opportunities_won
      denominator: opportunities_closed
