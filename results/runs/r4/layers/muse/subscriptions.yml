semantic_models:
  - name: subscriptions
    description: One row per subscription per calendar month-end from Jan 2023 through Jun 2025, carrying the subscription version in force on that date. Includes every status (active, past_due, trialing, canceled), every account including internal and deleted ones, and monthly plus annual billing intervals. Recurring metrics filter this to paying statuses and external accounts.
    model: ref('fct_subscription_months')
    defaults:
      agg_time_dimension: month_end
    entities:
      - name: subscription
        description: The seat-based subscription contract. Grain of this model is subscription by month, so one subscription appears in many rows.
        type: primary
        expr: subscription_id
      - name: account
        description: The account that owns the subscription. Joins to the accounts model for segment, region and currency slicing.
        type: foreign
        expr: account_id
      - name: plan
        description: The plan of the version in force at month-end. Joins to the plans model for plan slicing.
        type: foreign
        expr: plan_id
    dimensions:
      - name: month_end
        description: Last calendar day of the month the snapshot row describes. Recurring metrics treat the value as the whole month.
        type: time
        type_params:
          time_granularity: day
      - name: status
        description: Subscription version status at month-end. active and past_due count as paying; trialing (free trial, no commitment) and canceled (terminated contract) never count as paying.
        type: categorical
      - name: billing_interval
        description: Contract billing interval of the version in force, month or year. Annual contract value is divided by 12 to normalize to monthly.
        type: categorical
      - name: currency
        description: ISO currency the subscription is priced in (USD, EUR, GBP, JPY). Amounts convert to USD at the month-end FX rate.
        type: categorical
    measures:
      - name: mrr_usd
        description: Sum of monthly recurring revenue in USD. Includes seats times unit price less the version discount, with annual contracts divided by 12, converted at month-end FX. Only meaningful with the paying filters applied (active and past_due statuses, external non-deleted accounts); unfiltered rows include trialing, canceled, internal and deleted rows.
        agg: sum
        expr: seats * unit_price_minor * (1 - discount_pct) / case when billing_interval = 'year' then 12 else 1 end / power(10, minor_unit_exponent) * usd_per_unit
      - name: paying_accounts
        description: Distinct accounts counted once each. Only meaningful with the paying filters applied (active and past_due statuses, external non-deleted accounts); unfiltered rows include trialing, canceled, internal and deleted rows.
        agg: count_distinct
        expr: account_id
  - name: customer_months
    description: Helper model with one row per eligible account per month-end from Jan 2023 through Jun 2025. Precomputes whether the account was paying this month and last month, whether it churned, and whether this month is its first paying month. Excludes internal and deleted accounts entirely; only active and past_due subscription statuses count as paying. Trialing and canceled statuses, and subscriptions that started and ended mid-month without spanning a month-end, never count as paying.
    model: ref('customer_months')
    defaults:
      agg_time_dimension: month_end
    entities:
      - name: account_month
        description: Surrogate key for one account in one month. Primary key of this helper model.
        type: primary
        expr: account_month_id
      - name: account
        description: The customer account. Joins to the accounts model for segment, region and currency slicing.
        type: foreign
        expr: account_id
    dimensions:
      - name: month_end
        description: Last calendar day of the month the row describes.
        type: time
        type_params:
          time_granularity: day
      - name: is_paying
        description: True when the account had at least one active or past_due subscription at month-end. False for trial-only, canceled, and never-subscribed accounts.
        type: categorical
      - name: prev_is_paying
        description: True when the account was paying at the previous month-end. False for Jan 2023, which has no predecessor.
        type: categorical
      - name: is_churned
        description: True when the account was paying last month-end but is not paying this month-end. False for accounts that never paid and for Jan 2023.
        type: categorical
      - name: is_new
        description: True only in the account's first paying month. False for reactivations after a churn and for accounts that never paid. Left-censored, so accounts already paying in Jan 2023 count as new in Jan 2023.
        type: categorical
      - name: first_paying_month
        description: Month-end of the first month the account was paying, null for accounts that never paid.
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: new_accounts
        description: Distinct accounts whose first paying month is the row month. Excludes reactivations, trial starts, and internal or deleted accounts.
        agg: count_distinct
        expr: account_id
      - name: churned_accounts
        description: Distinct accounts paying last month-end but not this month-end. Excludes never-paying accounts and internal or deleted accounts.
        agg: count_distinct
        expr: account_id
      - name: prior_paying_accounts
        description: Distinct accounts that were paying at the previous month-end. Denominator input for churn rate; zero in Jan 2023.
        agg: count_distinct
        expr: account_id