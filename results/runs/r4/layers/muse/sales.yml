semantic_models:
  - name: usage
    description: One row per account per day per event type with the total quantity of events. Includes billable api_call events and non-billable health_check heartbeat events (a constant 288 per day synthetic monitor signal). Usage metrics include only api_call events.
    model: ref('fct_usage_daily')
    defaults:
      agg_time_dimension: usage_date
    entities:
      - name: usage_day
        description: Surrogate key for one account, day and event type. Primary key of this model.
        type: primary
        expr: account_id || '_' || cast(usage_date as varchar) || '_' || event_type
      - name: account
        description: The account that generated the usage. Joins to the accounts model for segment, region and currency slicing.
        type: foreign
        expr: account_id
    dimensions:
      - name: usage_date
        description: Date the usage occurred. Billable usage is attributed to this date.
        type: time
        type_params:
          time_granularity: day
      - name: event_type
        description: Type of usage event. api_call events are billable product usage; health_check events are a synthetic 288-per-day monitor heartbeat and never count as billable.
        type: categorical
    measures:
      - name: billable_events
        description: Sum of billable usage events. Includes api_call events of external non-deleted accounts. Excludes health_check heartbeat events and internal or deleted accounts.
        agg: sum
        expr: quantity
  - name: opportunities
    description: One row per sales opportunity. Includes new-business and expansion opportunities in every stage (open, closed_won and closed_lost). Bookings count only closed_won opportunities at their USD amount; open pipeline and lost deals never count as bookings.
    model: ref('fct_opportunities')
    defaults:
      agg_time_dimension: close_date
    entities:
      - name: opportunity
        description: The sales opportunity. Primary key of fct_opportunities.
        type: primary
        expr: opportunity_id
      - name: account
        description: The prospect or customer account. Joins to the accounts model for segment, region and currency slicing.
        type: foreign
        expr: account_id
      - name: sales_rep
        description: The representative who owns the opportunity. Joins to the sales_reps model for team and rep slicing.
        type: foreign
        expr: rep_id
    dimensions:
      - name: close_date
        description: Date the opportunity closed (won or lost), or the expected close date while still open. Bookings and win rate are attributed to this date.
        type: time
        type_params:
          time_granularity: day
      - name: created_date
        description: Date the opportunity was created. Pipeline creation can be sliced by this date.
        type: time
        type_params:
          time_granularity: day
      - name: opportunity_type
        description: new for new-business opportunities, expansion for upsells into existing accounts. Both types count as bookings; new bookings counts only new.
        type: categorical
      - name: stage
        description: Opportunity stage. closed_won counts as bookings; closed_lost counts only in the win rate denominator; open pipeline is undecided and never counts as bookings or in win rate.
        type: categorical
    measures:
      - name: booking_usd
        description: Sum of opportunity amounts, already stored in USD with no FX conversion. Only meaningful with a closed_won filter applied; unfiltered rows include open and lost opportunities.
        agg: sum
        expr: amount_usd
      - name: new_booking_usd
        description: Sum of new-business opportunity amounts in USD. Includes closed_won opportunities with type new for external non-deleted accounts. Excludes expansion, open and lost opportunities and internal or deleted accounts.
        agg: sum
        expr: amount_usd
      - name: expansion_booking_usd
        description: Sum of expansion opportunity amounts in USD. Includes closed_won opportunities with type expansion for external non-deleted accounts. Excludes new-business, open and lost opportunities and internal or deleted accounts.
        agg: sum
        expr: amount_usd
      - name: won_opportunities
        description: Count of opportunities that closed as won, for external non-deleted accounts. Excludes open and lost opportunities and internal or deleted accounts.
        agg: count
        expr: opportunity_id
      - name: closed_opportunities
        description: Count of decided opportunities (closed_won plus closed_lost) for external non-deleted accounts. Excludes open pipeline and internal or deleted accounts.
        agg: count
        expr: opportunity_id