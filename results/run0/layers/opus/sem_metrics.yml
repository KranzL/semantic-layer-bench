version: 2

metrics:
  # ---------------- Recurring revenue ----------------
  - name: mrr
    label: MRR (USD)
    description: >
      Monthly recurring revenue in USD as of month end: seats × contracted unit price × (1 − discount) for every
      active or past_due subscription, annual plans divided by 12, converted at the month-end FX rate. Excludes
      trials, canceled subscriptions, tax, services, usage and internal accounts. For quarters/years it is the
      value at the end of the last month. Data covers Jan 2023 – Jun 2025.
    type: simple
    type_params:
      measure: mrr_usd

  - name: arr
    label: ARR (USD)
    description: Annual recurring revenue in USD = MRR × 12 at period end. Same inclusions/exclusions as MRR.
    type: derived
    type_params:
      expr: mrr * 12
      metrics:
        - name: mrr

  - name: paid_seats
    label: Paid seats
    description: Seats on active or past_due subscriptions at period end. Excludes trial seats and internal accounts.
    type: simple
    type_params:
      measure: paid_seats

  - name: paying_subscriptions
    label: Paying subscriptions
    description: Active or past_due subscriptions at period end. Excludes trials, canceled subscriptions and internal accounts. A customer can have several.
    type: simple
    type_params:
      measure: paying_subscriptions

  # ---------------- Customers ----------------
  - name: paying_customers
    label: Paying customers
    description: >
      Customers (logos) with at least one active or past_due subscription at period end. Subsidiary accounts are
      rolled up into their parent and counted once; trial-only and internal accounts are excluded. Slice by
      customer__segment / customer__region.
    type: simple
    type_params:
      measure: paying_customers

  - name: arpa
    label: ARPA (USD)
    description: >
      Average revenue per account (customer) per month in USD = MRR ÷ paying customers at period end.
      Customers are top-level parents with subsidiaries rolled up. Excludes trials and internal accounts. Slice by
      customer__segment / customer__region (dimensions shared by both inputs).
    type: ratio
    type_params:
      numerator: mrr
      denominator: paying_customers

  - name: new_customers
    label: New customers
    description: >
      Customers who became paying for the first time in the period (first month-end with an active or past_due
      subscription, including trial conversions). Excludes reactivated former customers and internal accounts.
      Every customer paying in Jan 2023 counts as new because history starts then.
    type: simple
    type_params:
      measure: new_customers

  - name: reactivated_customers
    label: Reactivated customers
    description: Former paying customers who started paying again in the period after at least one non-paying month end. Not counted in new_customers.
    type: simple
    type_params:
      measure: reactivated_customers

  - name: churned_customers
    label: Churned customers (logo churn)
    description: >
      Customers paying at one month end with no active or past_due subscription at the next month end, summed over
      the period. A customer churns only when all its and its subsidiaries' subscriptions have ended; downgrades
      and canceled trials are not churn. Excludes internal accounts.
    type: simple
    type_params:
      measure: churned_customers

  - name: customers_at_period_start
    label: Customers at start of period
    description: Paying customers at the end of the month before the period starts (opening customer base). Denominator of logo churn rate.
    type: simple
    type_params:
      measure: customers_at_period_start

  - name: logo_churn_rate
    label: Logo churn rate
    description: >
      Churned customers in the period ÷ paying customers at the start of the period (0.05 = 5%). Monthly when
      grouped by month; for quarters/years it is total churned logos over the opening customer base. Excludes
      trials and internal accounts; subsidiaries roll up into their parent.
    type: ratio
    type_params:
      numerator: churned_customers
      denominator: customers_at_period_start

  - name: churned_mrr
    label: Churned MRR (USD)
    description: Prior-month-end MRR in USD of customers that churned in the period. Excludes contraction from customers still paying.
    type: simple
    type_params:
      measure: churned_mrr_usd

  # ---------------- Billing, revenue, cash ----------------
  - name: billings
    label: Billings (USD)
    description: >
      Amount invoiced in USD by invoice issue date, net of discounts and excluding tax, for finalized invoices
      (open, paid, uncollectible) of subscription and services types. Excludes draft and void invoices, credit
      notes/refunds and internal accounts. Converted at the issue-date FX rate.
    type: simple
    type_params:
      measure: billings_usd

  - name: billed_tax
    label: Tax billed (USD)
    description: Tax/VAT in USD on finalized (open, paid, uncollectible) invoices by issue date. Not part of billings.
    type: simple
    type_params:
      measure: billed_tax_usd

  - name: uncollectible_amount
    label: Uncollectible invoices (USD)
    description: Total (including tax) in USD of invoices written off as uncollectible, by invoice issue date.
    type: simple
    type_params:
      measure: uncollectible_amount_usd

  - name: recognized_revenue
    label: Recognized revenue (USD)
    description: >
      Revenue recognized in the period in USD: subscription invoices spread daily over their service period,
      services invoices recognized when issued. Net of discounts, excluding tax, from open, paid and uncollectible
      invoices. Excludes draft/void invoices, refunds/credit notes and internal accounts. Converted at the invoice
      issue-date FX rate. Monthly grain (no daily breakdown).
    type: simple
    type_params:
      measure: recognized_revenue_usd

  - name: cash_collected
    label: Cash collected (USD)
    description: >
      Cash received in USD from succeeded payments by received date, including tax and before refunds. Excludes
      failed payment attempts and internal accounts. Converted at the received-date FX rate.
    type: simple
    type_params:
      measure: cash_collected_usd

  - name: failed_payments
    label: Failed payment amount (USD)
    description: Amount in USD of failed payment attempts by attempt date (no cash moved). Excludes internal accounts.
    type: simple
    type_params:
      measure: failed_payment_amount_usd

  - name: refunds
    label: Refunds (USD)
    description: >
      Money refunded to customers in USD via credit notes (all reasons: service_credit, goodwill,
      downgrade_adjustment, billing_error), by credit note issue date. Excludes internal accounts.
    type: simple
    type_params:
      measure: refunds_usd

  - name: refund_count
    label: Refund count
    description: Number of credit notes (refunds) issued. Excludes internal accounts.
    type: simple
    type_params:
      measure: refund_count

  - name: net_cash_collected
    label: Net cash collected (USD)
    description: Cash collected minus refunds in USD for the period (each by its own date). Excludes failed payments and internal accounts.
    type: derived
    type_params:
      expr: cash_collected - refunds
      metrics:
        - name: cash_collected
        - name: refunds

  # ---------------- Usage ----------------
  - name: billable_usage
    label: Billable usage (API calls)
    description: Billable usage units (API calls) by usage date. Excludes non-billable health_check events and internal accounts.
    type: simple
    type_params:
      measure: billable_usage_units

  # ---------------- Sales ----------------
  - name: bookings
    label: Bookings (USD)
    description: >
      Contract value in USD of closed_won opportunities (new business and expansion) by close date. Excludes open
      and closed_lost opportunities and internal accounts. Slice by sales_rep__team for sales team.
    type: simple
    type_params:
      measure: bookings_usd

  - name: new_bookings
    label: New bookings (USD)
    description: Contract value in USD of closed_won new-business (new-logo) opportunities by close date. Excludes expansion, open and lost opportunities.
    type: simple
    type_params:
      measure: new_bookings_usd

  - name: expansion_bookings
    label: Expansion bookings (USD)
    description: Contract value in USD of closed_won expansion opportunities by close date. Excludes new business, open and lost opportunities.
    type: simple
    type_params:
      measure: expansion_bookings_usd

  - name: won_deals
    label: Won deals
    description: Number of closed_won opportunities by close date.
    type: simple
    type_params:
      measure: won_opportunities

  - name: closed_deals
    label: Closed deals
    description: Number of closed opportunities (won + lost) by close date. Excludes open opportunities.
    type: simple
    type_params:
      measure: closed_opportunities

  - name: win_rate
    label: Win rate
    description: >
      Closed_won opportunities ÷ closed opportunities (won + lost), by count, by close date (0.5 = 50%). Excludes
      open opportunities and internal accounts. Covers new and expansion; group by opportunity__opportunity_type
      for new-business win rate.
    type: ratio
    type_params:
      numerator: won_deals
      denominator: closed_deals

  - name: open_pipeline
    label: Open pipeline (USD)
    description: Amount in USD of opportunities still open, by expected close date. Excludes closed opportunities.
    type: simple
    type_params:
      measure: open_pipeline_usd
